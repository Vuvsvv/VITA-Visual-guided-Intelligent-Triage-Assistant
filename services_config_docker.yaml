# ============================================
# AI 模型服務網關 - 服務配置檔 v4（Docker，endpoint 用容器名稱）
# ============================================
# 每一個 enabled: true 的服務，docker-compose.yml 都必須有對應的容器，
# 否則 /health 會永遠顯示 unhealthy。

services:

  taiwanese_asr:
    name: "台語語音識別"
    description: "台語語音 → 中文字（Breeze-ASR-26）"
    version: "2.3.0"
    enabled: true
    endpoint: "http://taiwanese-asr:8001"
    health_check: "/"
    timeout: 120
    input_type: "audio"
    output_type: "text"
    forward_path: "/api/transcribe"
    file_field: "audio_file"
    models: ["MediaTek-Research/Breeze-ASR-26"]


  taiwanese_tts:
    name: "台語文字轉語音"
    description: "中文字 → 台羅數字調(Gemini) → 台語語音(Chatterbox LoRA 微調，模型 B)"
    version: "5.0.0"
    enabled: true
    endpoint: "http://taiwanese-tts:8003"
    health_check: "/"
    timeout: 300
    input_type: "text"
    output_type: "audio"
    forward_path: "/api/synthesize"
    file_field: null
    models: ["gemini-2.0-flash", "Chatterbox (LoRA fine-tuned, model B)"]

  chinese_tts:
    name: "中文文字轉語音"
    description: "中文字 → 台灣國語語音（支援語音克隆）"
    version: "4.0.0"
    enabled: true
    endpoint: "http://chinese-tts:8004"
    health_check: "/"
    timeout: 300
    input_type: "text"
    output_type: "audio"
    forward_path: "/api/synthesize"
    file_field: null
    models: ["MediaTek-Research/BreezyVoice-300M"]

global:
  gateway_port: 8000
