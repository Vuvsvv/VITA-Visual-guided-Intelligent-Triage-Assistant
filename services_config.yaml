# ============================================
# AI 模型服務網關 - 服務配置檔 v4（本機 / 裸機）
# ============================================
# endpoint 可用環境變數覆蓋：<SERVICE_TYPE>_ENDPOINT
#   例：CHINESE_TTS_ENDPOINT=http://127.0.0.1:8004
# timeout 必須 <= Nginx 的 proxy_read_timeout（見 deploy.sh），否則長工作一定 504。

services:

  # ── 台語 ASR（Breeze-ASR-26）──
  taiwanese_asr:
    name: "台語語音識別"
    description: "台語語音 → 中文字（Breeze-ASR-26，不需翻譯）"
    version: "2.3.0"
    enabled: true
    endpoint: "http://localhost:8001"
    health_check: "/"
    timeout: 120
    input_type: "audio"
    output_type: "text"
    forward_path: "/api/transcribe"
    file_field: "audio_file"
    models:
      - "MediaTek-Research/Breeze-ASR-26"


  # ── 台語 TTS（Gemini + GPT-SoVITS，透過 GSV api_v2）──
  taiwanese_tts:
    name: "台語文字轉語音"
    description: "中文字 → 台羅數字調(Gemini) → 台語語音(Chatterbox LoRA 微調，模型 B)"
    version: "5.0.0"
    enabled: true
    endpoint: "http://localhost:8003"
    health_check: "/"
    timeout: 300
    input_type: "text"
    output_type: "audio"
    forward_path: "/api/synthesize"
    file_field: null
    models:
      - "gemini-2.0-flash"
      - "Chatterbox (LoRA fine-tuned, model B)"

  # ── 中文 TTS（BreezyVoice）──
  chinese_tts:
    name: "中文文字轉語音"
    description: "中文字 → 台灣國語語音（支援語音克隆）"
    version: "4.0.0"
    enabled: true
    endpoint: "http://localhost:8004"
    health_check: "/"
    timeout: 300
    input_type: "text"
    output_type: "audio"
    forward_path: "/api/synthesize"
    file_field: null
    models:
      - "MediaTek-Research/BreezyVoice-300M"

global:
  gateway_port: 8000
